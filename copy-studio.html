<style>
:root {
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "EB Garamond", Georgia, serif;
  --bg: #2a1d17;
  --panel: #38271f;
  --card: #432f27;
  --ink: #f5ede1;
  --ink2: #cfbda9;
  --a1: #9fb697;
  --a2: #e1b38c;
  --on: #26180f;
  --line: rgba(245, 237, 225, 0.16);
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1.05rem;
  line-height: 1.5;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.7rem 1.2rem;
  background: #221712;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
}
.brand h1 {
  font-family: var(--serif);
  font-size: 1.45rem;
  font-weight: 600;
  margin: 0;
  color: var(--ink);
}
.brand span {
  font-size: 0.92rem;
  color: var(--ink2);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 0.55rem;
}
button, .btn-link {
  font: inherit;
  font-size: 0.92rem;
  padding: 0.42rem 0.85rem;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}
button:hover, .btn-link:hover {
  border-color: var(--a1);
}
button.primary {
  background: var(--a1);
  color: var(--on);
  border-color: var(--a1);
  font-weight: 600;
}
button.accent {
  background: var(--a2);
  color: var(--on);
  border-color: var(--a2);
  font-weight: 600;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
.status-pill {
  font-size: 0.88rem;
  color: var(--ink2);
  padding-inline: 0.5rem;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(430px, 48%) 1fr;
  flex: 1;
  min-height: 0;
}
.editor-pane {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: var(--panel);
  min-height: 0;
}
.tabs-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  padding: 0.65rem 0.9rem 0.5rem;
  background: rgba(0, 0, 0, 0.18);
  border-bottom: 1px solid var(--line);
}
.tab-btn {
  padding: 0.32rem 0.7rem;
  font-size: 0.88rem;
  border-radius: 3px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--ink2);
}
.tab-btn:hover {
  color: var(--ink);
  border-color: var(--line);
}
.tab-btn.active {
  background: var(--a1);
  color: var(--on);
  border-color: var(--a1);
  font-weight: 600;
}
.search-bar {
  padding: 0.55rem 0.9rem;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 0.6rem;
  align-items: center;
}
.search-bar input {
  width: 100%;
  padding: 0.42rem 0.7rem;
  background: rgba(0, 0, 0, 0.22);
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--ink);
  font: inherit;
  font-size: 0.95rem;
}
.search-bar input:focus {
  outline: 2px solid var(--a2);
  border-color: transparent;
}
.fields-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 1.1rem 3rem;
}
.sec-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.95rem 1.05rem;
  margin-bottom: 1rem;
}
.sec-card h2 {
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 600;
  margin: 0 0 0.75rem;
  color: var(--a2);
  border-bottom: 1px solid var(--line);
  padding-bottom: 0.35rem;
}
.field-row {
  margin-bottom: 0.8rem;
}
.field-row:last-child {
  margin-bottom: 0;
}
.field-row label {
  display: flex;
  justify-content: space-between;
  font-size: 0.86rem;
  color: var(--ink2);
  margin-bottom: 0.22rem;
}
.field-row label code {
  font-family: monospace;
  font-size: 0.72rem;
  opacity: 0.55;
}
.field-row input, .field-row textarea {
  width: 100%;
  font: inherit;
  font-size: 1.02rem;
  color: var(--ink);
  background: rgba(38, 24, 15, 0.65);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0.45rem 0.65rem;
  resize: vertical;
}
.field-row textarea {
  min-height: 3.4rem;
  line-height: 1.45;
}
.field-row input:focus, .field-row textarea:focus {
  outline: 2px solid var(--a1);
  border-color: transparent;
  background: rgba(38, 24, 15, 0.95);
}
.grid-compact {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 0.55rem;
  padding: 0.55rem;
  background: rgba(0, 0, 0, 0.14);
  border-radius: 3px;
  margin-bottom: 0.55rem;
}
.grid-compact .field-row {
  margin-bottom: 0;
}
.preview-pane {
  display: flex;
  flex-direction: column;
  background: #1c130f;
  min-height: 0;
}
.preview-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.45rem 0.9rem;
  background: #221712;
  border-bottom: 1px solid var(--line);
  font-size: 0.88rem;
  color: var(--ink2);
}
.preview-frame {
  flex: 1;
  width: 100%;
  border: 0;
  background: #38271f;
}
/* Git history modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.modal-backdrop[hidden] {
  display: none;
}
.modal {
  width: min(640px, 94vw);
  max-height: 82vh;
  background: var(--panel);
  border: 1px solid var(--a1);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 60px rgba(0,0,0,0.7);
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1.1rem;
  border-bottom: 1px solid var(--line);
}
.modal-head h3 {
  font-family: var(--serif);
  font-size: 1.35rem;
  margin: 0;
}
.modal-body {
  padding: 1rem 1.1rem;
  overflow-y: auto;
}
.commit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.65rem 0.75rem;
  border: 1px solid var(--line);
  border-radius: 3px;
  margin-bottom: 0.5rem;
  background: var(--card);
}
.commit-meta strong {
  display: block;
  color: var(--ink);
}
.commit-meta small {
  color: var(--ink2);
  font-size: 0.84rem;
}
.tag-badge {
  display: inline-block;
  background: var(--a2);
  color: var(--on);
  font-size: 0.74rem;
  font-weight: 600;
  padding: 0.05rem 0.4rem;
  border-radius: 2px;
  margin-left: 0.4rem;
}

<header class="topbar">
  <div class="brand">
    <h1>Devin Tucker — Copy Studio</h1>

    <button type="button" id="btn-checkpoint" class="accent" title="Save files and create a Git commit">Save + Git Checkpoint</button>
    <button type="button" id="btn-history">Version History / Rollback</button>
    <a class="btn-link" id="open-live-link" href="/" target="_blank">Open Full Page ↗</a>
  </div>
</header>

<div class="workspace">
  <div class="editor-pane">
    <div class="tabs-bar" id="tabs-bar">
      <button type="button" class="tab-btn active" data-tab="home" data-url="/index.html">Homepage</button>
      <button type="button" class="tab-btn" data-tab="events" data-url="/event-videography-portland/index.html">Event Videography</button>
      <button type="button" class="tab-btn" data-tab="dance" data-url="/dance-and-performance-film-portland/index.html">Dance &amp; Circus Film</button>
      <button type="button" class="tab-btn" data-tab="editing" data-url="/video-editing-portland/index.html">Video Editing</button>
      <button type="button" class="tab-btn" data-tab="now" data-url="/now.html">Now Page</button>
      <button type="button" class="tab-btn" data-tab="hi" data-url="/hi.html">Contact Card &amp; 404</button>
      <button type="button" class="tab-btn" data-tab="global" data-url="/index.html">Global &amp; Form Settings</button>
    </div>
    <div class="search-bar">
      <input type="search" id="search-input" placeholder="Search any text or label across all pages (e.g. 'Slipstream', 'Gala', 'spring 2027')...">
    </div>
    <div class="fields-scroll" id="fields-container">
      Loading website copy...
    </div>
  </div>

  <div class="preview-pane">
    <div class="preview-bar">
      <span id="preview-label">Live Preview: <strong>/index.html</strong> (updates as you type)</span>
      <label style="cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;color:var(--ink)">
        <input type="checkbox" id="chk-inline-preview" checked>
        Allow clicking text directly inside preview to edit
      </label>
    </div>
    <iframe class="preview-frame" id="preview-frame" src="/index.html?studio=1&edit=1"></iframe>
  </div>
</div>

<!-- Version History / Rollback Modal -->
<div class="modal-backdrop" id="history-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>Git Version History &amp; Rollback</h3>
      <button type="button" id="close-history">Close</button>
    </div>
    <div class="modal-body" id="history-list">
      Loading commits...
    </div>
  </div>
</div>

  function hasUnsaved() {
    return Object.keys(dirty.copy).length + Object.keys(dirty.settings).length > 0;
  }

  function updateStatusUI() {
    var count = Object.keys(dirty.copy).length + Object.keys(dirty.settings).length;
    saveBtn.disabled = count === 0;
    if (count > 0) {
      saveBtn.textContent = 'Save Changes (' + count + ')';
      statusEl.textContent = count + ' unsaved edit' + (count === 1 ? '' : 's');
      statusEl.style.color = 'var(--a2)';
    } else {
      saveBtn.textContent = 'Save Changes';
    }
  }

  function renderFields() {
    container.innerHTML = '';
    var q = searchQuery.trim().toLowerCase();
    var tabKeys = q ? Object.keys(SCHEMA) : [currentTab];

    tabKeys.forEach(function (tabName) {
      var sections = SCHEMA[tabName] || [];
      sections.forEach(function (sec) {
        var card = document.createElement('div');
        card.className = 'sec-card';
        var h2 = document.createElement('h2');
        h2.textContent = (q ? '[' + tabName.toUpperCase() + '] ' : '') + sec.title;
        card.appendChild(h2);
        var addedAny = false;

        if (sec.compactGroups) {
          sec.compactGroups.forEach(function (group) {
            var matchGroup = !q || group.some(function (f) {
              var val = (state.copy[f.key] || '').toLowerCase();
              return f.label.toLowerCase().indexOf(q) !== -1 || f.key.toLowerCase().indexOf(q) !== -1 || val.indexOf(q) !== -1;
            });
            if (!matchGroup) return;
            addedAny = true;
            var gwrap = document.createElement('div');
            gwrap.className = 'grid-compact';
            group.forEach(function (f) {
              gwrap.appendChild(buildFieldRow(f));
            });
            card.appendChild(gwrap);
          });
        }

        if (sec.fields) {
          sec.fields.forEach(function (f) {
            var val = f.setting ? (state.settings[f.setting] || '') : (state.copy[f.key] || '');
            var match = !q ||
              f.label.toLowerCase().indexOf(q) !== -1 ||
              (f.key && f.key.toLowerCase().indexOf(q) !== -1) ||
              val.toLowerCase().indexOf(q) !== -1;
            if (!match) return;
            addedAny = true;
            card.appendChild(buildFieldRow(f));
          });
        }

        if (addedAny) {
          container.appendChild(card);
        }
      });
    });

    if (!container.children.length) {
      container.innerHTML = '<p style="color:var(--ink2);padding:1rem">No text fields matched "' + searchQuery + '".</p>';
    }
  }

  function buildFieldRow(f) {
    var row = document.createElement('div');
    row.className = 'field-row';
    var lbl = document.createElement('label');
    var span = document.createElement('span');
    span.textContent = f.label;
    var code = document.createElement('code');
    code.textContent = f.setting ? ('SITE.' + f.setting) : f.key;
    lbl.appendChild(span);
    lbl.appendChild(code);
    row.appendChild(lbl);

    var val = f.setting ? (state.settings[f.setting] || '') : (state.copy[f.key] || '');
    var input = document.createElement(f.multiline ? 'textarea' : 'input');
    if (!f.multiline) input.type = 'text';
    input.value = val;
    if (f.key) input.setAttribute('data-field-key', f.key);
    if (f.setting) input.setAttribute('data-field-setting', f.setting);

    input.addEventListener('focus', function () {
      if (f.key && previewFrame.contentWindow) {
        previewFrame.contentWindow.postMessage({ type: 'copy:highlight', key: f.key }, '*');
      }
    });

    input.addEventListener('input', function () {
      var newVal = input.value;
      if (f.setting) {
        state.settings[f.setting] = newVal;
        dirty.settings[f.setting] = newVal;
        if (f.setting === 'email') {
          state.copy['global.email'] = newVal;
          dirty.copy['global.email'] = newVal;
          if (previewFrame.contentWindow) {
            previewFrame.contentWindow.postMessage({ type: 'copy:update', key: 'global.email', value: newVal }, '*');
          }
        }
      } else {
        state.copy[f.key] = newVal;
        dirty.copy[f.key] = newVal;
        if (f.key === 'global.email') {
          state.settings.email = newVal;
          dirty.settings.email = newVal;
        }
        if (previewFrame.contentWindow) {
          previewFrame.contentWindow.postMessage({ type: 'copy:update', key: f.key, value: newVal }, '*');
        }
      }
      updateStatusUI();
    });

    row.appendChild(input);
    return row;
  }

  // Listen for inline edits made directly inside the preview iframe
  window.addEventListener('message', function (ev) {
    if (!ev.data || ev.data.type !== 'studio:from-iframe') return;
    var k = ev.data.key, v = ev.data.value;
    state.copy[k] = v;
    dirty.copy[k] = v;
    if (k === 'global.email') {
      state.settings.email = v;
      dirty.settings.email = v;
    }
    var inp = document.querySelector('[data-field-key="' + k + '"]');
    if (inp && document.activeElement !== inp) {
      inp.value = v;
    }
    updateStatusUI();
  });

  function apiFetch(path, opts) {
    var base = location.port === '8000' ? 'http://localhost:8080' : '';
    return fetch(base + path, opts).then(function (r) {
      if (!r.ok && !base) {
        return fetch('http://localhost:8080' + path, opts);
      }
      return r;
    });
  }

  function saveAll(withCheckpoint) {
    statusEl.textContent = 'Saving to HTML files...';
    return apiFetch('/api/save-copy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ settings: dirty.settings, copy: dirty.copy })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        dirty = { settings: {}, copy: {} };
        updateStatusUI();
        statusEl.textContent = '✓ Saved (' + (res.updated_files || 0) + ' files updated)';
        statusEl.style.color = 'var(--a1)';
        if (withCheckpoint) {
          var msg = window.prompt('Describe this version checkpoint (for Git history):', 'Update website copy');
          if (!msg) return;
          statusEl.textContent = 'Creating Git checkpoint...';
          return apiFetch('/api/git-checkpoint', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, push: true })
          })
            .then(function (r) { return r.json(); })
            .then(function (gres) {
              if (gres.ok) {
                statusEl.textContent = '✓ Committed (' + gres.commit + ')' + (gres.pushed ? ' & pushed to GitHub' : '');
              } else {
                statusEl.textContent = 'Saved files (' + (gres.error || 'no new changes to commit') + ')';
              }
            });
        }
      });
  }

  saveBtn.addEventListener('click', function () { saveAll(false); });
  checkpointBtn.addEventListener('click', function () { saveAll(true); });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      if (hasUnsaved()) saveAll(false);
    }
  });

  // Tabs switching
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentTab = btn.getAttribute('data-tab');
      var url = btn.getAttribute('data-url');
      var inlineParam = chkInline.checked ? '&edit=1' : '';
      if (previewFrame.getAttribute('data-current-url') !== url) {
        previewFrame.setAttribute('data-current-url', url);
        previewFrame.src = url + '?studio=1' + inlineParam;
        previewLabel.innerHTML = 'Live Preview: <strong>' + url + '</strong> (updates as you type)';
        openLiveLink.href = url;
      }
      renderFields();
    });
  });

  chkInline.addEventListener('change', function () {
    if (previewFrame.contentWindow) {
      previewFrame.contentWindow.postMessage({ type: 'copy:toggle-inline', enabled: chkInline.checked }, '*');
    }
  });

  searchInput.addEventListener('input', function () {
    searchQuery = searchInput.value;
    renderFields();
  });

  // Git History Modal
  var histModal = document.getElementById('history-modal');
  var histList = document.getElementById('history-list');
  document.getElementById('btn-history').addEventListener('click', function () {
    histModal.hidden = false;
    loadHistory();
  });
  document.getElementById('close-history').addEventListener('click', function () {
    histModal.hidden = true;
  });

  function loadHistory() {
    histList.innerHTML = 'Loading Git history...';
    apiFetch('/api/git-history')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        histList.innerHTML = '';
        (data.commits || []).forEach(function (c) {
          var row = document.createElement('div');
          row.className = 'commit-row';
          var meta = document.createElement('div');
          meta.className = 'commit-meta';
          var titleHtml = '<strong>' + c.subject;
          if (c.ref) {
            titleHtml += ' <span class="tag-badge">' + c.ref + '</span>';
          }
          titleHtml += '</strong><small>' + c.hash + ' · ' + c.date + '</small>';
          meta.innerHTML = titleHtml;
          var btn = document.createElement('button');
          btn.textContent = 'Restore this version';
          btn.addEventListener('click', function () {
            if (!window.confirm('Restore website files to commit "' + c.subject + '" (' + c.hash + ')? (A safety commit of your current state will be made first.)')) return;
            apiFetch('/api/git-restore', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ref: c.hash })
            })
              .then(function (r) { return r.json(); })
              .then(function () {
                window.location.reload();
              });
          });
          row.appendChild(meta);
          row.appendChild(btn);
          histList.appendChild(row);
        });
      });
  }

  // Initial load of content.json
  apiFetch('/api/copy')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      state = data;
      renderFields();
    });
})();
