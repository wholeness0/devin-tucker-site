<style>
:root {
  --serif: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --radius: 3px;
  --ease: cubic-bezier(.22, .7, .2, 1);
  color-scheme: dark;

  --bg: #38271f; --bg2: #473229; --surf: #432f27;
  --ink: #f5ede1; --ink2: #cfbda9;
  --a1: #9fb697; --a2: #e1b38c; --on: #26180f;
  --motif: #f1dcbc;
  --line: color-mix(in srgb, var(--ink) 18%, transparent);
  --spin: 60s;                 /* one clockwise turn of the logo */
  --ring: color-mix(in srgb, var(--a1) 18%, #fff);   /* the rings: an off-white with a faint sage cast */
  --ring-far: .13; --ring-near: .19;                 /* how strong the outline is on the far and near layers */
  --ring-k: .75;                                     /* overall multiplier, used by the slider in the mock panel */
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 1.16rem; line-height: 1.6; letter-spacing: .01em; font-variant-numeric: oldstyle-nums; }
::selection { background: color-mix(in srgb, var(--a1) 55%, transparent); color: var(--ink); }
a { color: inherit; }
svg { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--a2); outline-offset: 3px; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.emblem { fill: none; stroke: currentColor; stroke-width: 9; stroke-linecap: round; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; margin: 0; }
p { margin: 0 0 1rem; text-wrap: pretty; }
@keyframes spin { to { transform: rotate(360deg); } }
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1.4rem; width: min(1120px, 100% - 3rem); margin-inline: auto; }
.mark { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; font-family: var(--serif); font-size: 1.55rem; font-weight: 600; }
.mark .emblem { flex: none; width: 28px; height: 28px; color: var(--a1); stroke-width: 10; animation: spin var(--spin) linear infinite; }
.btn { display: inline-block; background: var(--a1); color: var(--on); padding: .8rem 1.5rem; border: 0; border-radius: var(--radius); font: inherit; font-weight: 500; letter-spacing: .02em; text-decoration: none; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--a1); filter: none; }
.textlink { color: var(--ink); text-decoration: underline; text-decoration-color: var(--a2); text-decoration-thickness: 1.5px; text-underline-offset: .32em; }
.textlink:hover { text-decoration-color: var(--a1); }
.statusline { display: flex; align-items: center; justify-content: center; margin: 0 0 .25rem; color: var(--ink2); font-size: .95rem; }
.dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--a1); margin-right: .6rem; animation: dot 3.2s ease-in-out infinite; }
@keyframes dot { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.foot { padding-block: 2.5rem 3rem; text-align: center; color: var(--ink2); font-size: .95rem; }
.foot p { margin: 0 0 .3rem; }
.motion-toggle { font: inherit; font-size: .9rem; color: var(--ink2); background: none; border: 0; padding: .2rem .4rem; cursor: pointer; text-decoration: underline; text-underline-offset: .3em; }
.motion-toggle:hover:not(:disabled) { color: var(--ink); }
.motion-toggle:disabled { cursor: default; text-decoration: none; }
html[data-paused="true"] *, html[data-paused="true"] *::before, html[data-paused="true"] *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .mark .emblem { animation: none !important; } }

body { min-height: 100vh; }
main { width: min(26rem, 100% - 2.4rem); margin: 0 auto; padding-block: .6rem 1rem; text-align: center; }
.big { width: 76px; height: 76px; margin: .6rem auto 1rem; color: var(--a1); stroke-width: 7; animation: spin var(--spin) linear infinite; }
h1 { font-style: italic; font-size: clamp(2.8rem, 12vw, 3.8rem); line-height: 1.02; }
.line { font-family: var(--serif); font-size: 1.6rem; color: var(--ink2); margin: .5rem 0 1.6rem; line-height: 1.2; }
.stack { display: grid; gap: .8rem; }
.stack .btn { display: block; padding-block: 1.05rem; font-size: 1.15rem; }
.more { margin: 1.4rem 0 2rem; }
.qr-wrap { margin: 0 auto; width: 11.5rem; }
.qr { width: 100%; height: auto; border-radius: var(--radius); }
.qr-wrap figcaption { color: var(--ink2); font-size: .92rem; margin-top: .7rem; line-height: 1.4; }

@view-transition { navigation: auto; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .7s; }
</style>

<script>
(function () {
  var root = document.documentElement, reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var btn = document.getElementById('motion-toggle'), userPaused = false;
  try { userPaused = window.localStorage.getItem('motion') === 'paused'; } catch (e) {}
  function apply() {
    var p = reduce.matches || userPaused;
    root.setAttribute('data-paused', p ? 'true' : 'false');
    btn.disabled = reduce.matches;
    btn.textContent = reduce.matches ? 'Motion is off (system setting)' : (userPaused ? 'Play motion' : 'Pause motion');
    window.dispatchEvent(new Event('motionchange'));
  }
  btn.addEventListener('click', function () { userPaused = !userPaused; try { window.localStorage.setItem('motion', userPaused ? 'paused' : 'on'); } catch (e) {} apply(); });
  if (reduce.addEventListener) reduce.addEventListener('change', apply);
  var t = document.getElementById('local-time');
  if (t) { try { var f = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' }); var tick = function () { t.textContent = "It's " + f.format(new Date()).toLowerCase() + ' in Portland.'; }; tick(); setInterval(tick, 30000); } catch (e) {} }
  apply();
})();

</script>
